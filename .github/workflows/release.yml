name: release

# A tag is a promise that this exact commit was built and published. The plugin's install script fetches
# these artifacts and checks them against SHA256SUMS, so the files here and the files there have to be the
# same ones, produced by this workflow and nothing else.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            name: darwin-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: darwin-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: build
        run: cargo build --release --target ${{ matrix.target }}
      - name: package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf "$GITHUB_WORKSPACE/mint-${{ matrix.name }}.tar.gz" mint
          cd "$GITHUB_WORKSPACE"
          ./target/${{ matrix.target }}/release/mint --version
      - uses: actions/upload-artifact@v4
        with:
          name: mint-${{ matrix.name }}
          path: mint-${{ matrix.name }}.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # The installer is published from the repository, so the repository has to be here.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: checksums
        run: |
          cd artifacts
          ls -l
          # The installer is published beside the artifacts it installs, and its own hash goes in the
          # list: a person who is going to pipe a script into a shell deserves to be able to check it too.
          cp "$GITHUB_WORKSPACE/install.sh" install.sh
          sha256sum mint-*.tar.gz install.sh > SHA256SUMS
          cat SHA256SUMS
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "Built from $GITHUB_SHA. The install script verifies each file against SHA256SUMS." \
            artifacts/mint-*.tar.gz artifacts/install.sh artifacts/SHA256SUMS
