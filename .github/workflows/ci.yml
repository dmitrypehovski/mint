name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: build
        run: cargo build --release

      - name: the plugin manifests parse, and point at the skill that exists
        run: |
          python3 - <<'PY'
          import json, os, sys
          for path in (".claude-plugin/plugin.json", ".claude-plugin/marketplace.json",
                       ".codex-plugin/plugin.json", ".agents/plugins/marketplace.json"):
              with open(path) as fh:
                  json.load(fh)
              print(f"  {path} parses")
          for path in (".claude-plugin/marketplace.json", ".agents/plugins/marketplace.json"):
              doc = json.load(open(path))
              names = [p["name"] for p in doc["plugins"]]
              for name in names:
                  assert os.path.isdir("skills/" + name), f"{path} lists {name}, and there is no skills/{name}"
              print(f"  {path} lists {names}, and the skill directory is there")
          assert os.path.isfile("skills/mint/SKILL.md"), "no SKILL.md"
          print("  the skill is where both marketplaces say it is")

          # The version a plugin reports is the version of the binary it drives. Letting those drift is
          # how the quickstart came to document a release that behaved worse than the source.
          version = ""
          for line in open("Cargo.toml"):
              if line.startswith("version ="):
                  version = line.split('"')[1]
                  break
          for path in (".claude-plugin/plugin.json", ".codex-plugin/plugin.json"):
              got = json.load(open(path))["version"]
              assert got == version, f"{path} says {got}, Cargo.toml says {version}"
          print(f"  every manifest says {version}, and so does Cargo.toml")
          PY

      - name: test
        run: cargo test --release

      # Depends on the live demo host mint.arliwork.com. Deliberately NOT continue-on-error: if the
      # published artifacts stop checking out, that is a real failure and the build must say so.
      # It will fail spuriously only if the host is unreachable, which is itself worth knowing.
      - name: verify the live demo receipts
        continue-on-error: false
        run: |
          set -euo pipefail
          curl -fsSL https://mint.arliwork.com/receipts.json     -o receipts.json
          curl -fsSL https://mint.arliwork.com/policy.json       -o policy.json
          curl -fsSL https://mint.arliwork.com/endorsement.json  -o endorsement.json
          ./target/release/mint receipts \
            --in receipts.json --policy policy.json --endorsement endorsement.json | tee out.txt
          grep -q "OK" out.txt
